<div class="app-window" id="DrumApp">
  <div class="app-header"><span class="app-title">🥁 Drum Machine</span><div class="app-controls"><button class="minimize-btn">–</button><button class="close-btn">×</button></div></div>
  <div class="app-content">
    <div class="dr">
      <div class="dr-bar"><button id="dr-play">▶ Play</button><label>Tempo <input id="dr-bpm" type="range" min="60" max="180" value="110"><span id="dr-bpmv">110</span></label><button id="dr-clear">Clear</button></div>
      <div id="dr-grid" class="dr-grid"></div>
    </div>
  </div>
  <div class="resize-handle"></div>
</div>
